name: Deploy to GitHub Pages

# Builds the Astro site and publishes dist/ to GitHub Pages on every push to
# main. Requires: repo Settings -> Pages -> Source = "GitHub Actions".
#
# NOTE: This deploys a ROOT-served site. If you use the default
# username.github.io/blog subpath (no custom domain), internal links will 404
# because they are root-relative. Use a custom domain (recommended) or add an
# Astro `base` and prefix all links first.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
